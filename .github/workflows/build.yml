name: Build SimpleLogics ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build Stockfish ARM64
        working-directory: stockfish/src
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            OS=Android \
            optimize=yes \
            debug=no

      - name: Prepare DroidFish package
        run: |
          mkdir -p release

          cp stockfish/src/stockfish release/simplelogics

          chmod +x release/simplelogics

      - name: Download NNUE
        run: |
          wget -q \
          https://tests.stockfishchess.org/api/nn/nn-134a887f4c8f.nnue \
          -O release/simplelogics.nnue

      - name: Package
        run: |
          cd release
          zip -9 simplelogics-arm64.zip \
            simplelogics \
            simplelogics.nnue

      - name: Upload DroidFish Engine
        uses: actions/upload-artifact@v4
        with:
          name: simplelogics-arm64-droidfish
          path: release/simplelogics-arm64.zip
