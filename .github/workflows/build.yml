name: Build SimpleLogics Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018"

      - name: Build SimpleLogics ARM64
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            -O3 \
            -std=c++17 \
            -DNDEBUG \
            -static-libstdc++ \
            simplelogics.cpp \
            -o simplelogics

          file simplelogics
          chmod +x simplelogics

      - name: Upload DroidFish Engine
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLogics-Android-ARM64
          path: simplelogics
