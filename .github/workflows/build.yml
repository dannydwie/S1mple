name: Build SimpleLogics ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Clone Stockfish
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git stockfish

      - name: Build ARM64
        working-directory: stockfish/src
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            OS=Android \
            optimize=yes \
            debug=no

      - name: Rename engine
        run: |
          mkdir -p release
          cp stockfish/src/stockfish release/simplelogics

      - name: Download official NNUE
        run: |
          cd release

          wget -q \
          https://tests.stockfishchess.org/api/nn/nn-134a887f4c8f.nnue \
          -O simplelogics.nnue

          chmod +x simplelogics

      - name: Package
        run: |
          cd release
          zip -9 simplelogics-arm64.zip simplelogics simplelogics.nnue

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: simplelogics-arm64
          path: release/simplelogics-arm64.zip
