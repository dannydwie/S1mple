name: Build SimpleLogics ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download Stockfish source
        run: |
          git clone --depth 1 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish

      - name: Download official NNUE
        working-directory: stockfish/src
        run: |
          make net

      - name: Build ARM64 Android with embedded NNUE
        working-directory: stockfish/src
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            OS=Android \
            optimize=yes \
            debug=no

      - name: Strip binary
        working-directory: stockfish/src
        run: |
          llvm-strip stockfish || true
          ls -lh stockfish

      - name: Verify engine
        working-directory: stockfish/src
        run: |
          printf "uci\nquit\n" | ./stockfish | head -30

      - name: Prepare DroidFish engine
        run: |
          mkdir -p release
          cp stockfish/src/stockfish release/simplelogics
          chmod +x release/simplelogics

      - name: Show final size
        run: |
          ls -lh release/simplelogics
          file release/simplelogics

      - name: Package
        run: |
          cd release
          zip -9 simplelogics-arm64-droidfish.zip simplelogics

      - name: Upload DroidFish engine
        uses: actions/upload-artifact@v4
        with:
          name: simplelogics-arm64-droidfish
          path: release/simplelogics-arm64-droidfish.zip
